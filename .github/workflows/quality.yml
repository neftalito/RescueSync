name: Calidad

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rescuesync
          POSTGRES_PASSWORD: rescuesync_dev
          POSTGRES_USER: rescuesync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rescuesync -d rescuesync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      POSTGRES_DB: rescuesync
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: rescuesync_dev
      POSTGRES_PORT: 5432
      POSTGRES_USER: rescuesync
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar lint
        run: ruff check .

      - name: Verificar formato
        run: ruff format --check .

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Ejecutar pruebas
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          node-version: "24"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Verificar lint
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir aplicación
        run: npm run build

  quality:
    name: quality
    if: always()
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Comprobar resultados
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$BACKEND_RESULT" != "success" ]; then
            echo "Las verificaciones del backend no finalizaron correctamente."
            exit 1
          fi
          if [ "$FRONTEND_RESULT" != "success" ]; then
            echo "Las verificaciones del frontend no finalizaron correctamente."
            exit 1
          fi
