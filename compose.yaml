name: rescuesync

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rescuesync}
      POSTGRES_USER: ${POSTGRES_USER:-rescuesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescuesync_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: production
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rescuesync}
      POSTGRES_USER: ${POSTGRES_USER:-rescuesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescuesync_dev}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}"]'
      BONITA_BASE_URL: ${BONITA_BASE_URL:-http://host.docker.internal:8080/bonita}
      BONITA_USERNAME: ${BONITA_USERNAME:-install}
      BONITA_PASSWORD: ${BONITA_PASSWORD:-install}
      BONITA_PROCESS_DEFINITION_ID: ${BONITA_PROCESS_DEFINITION_ID:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: development
    command:
      - fastapi
      - dev
      - app/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *backend-environment
      COVERAGE_FILE: /tmp/.coverage
      RUFF_CACHE_DIR: /tmp/ruff_cache
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  bonita-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BONITA_DB_NAME:-bonita}
      POSTGRES_USER: ${BONITA_DB_USER:-bonita}
      POSTGRES_PASSWORD: ${BONITA_DB_PASS:-bpm}
      BIZ_DB_NAME: ${BONITA_BIZ_DB_NAME:-business_data}
      BIZ_DB_USER: ${BONITA_BIZ_DB_USER:-business_data}
      BIZ_DB_PASS: ${BONITA_BIZ_DB_PASS:-bpm}
    volumes:
      - bonita_db_data:/var/lib/postgresql/data
      - ./docker/bonita-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BONITA_DB_USER:-bonita} -d ${BONITA_DB_NAME:-bonita}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bonita:
    image: bonita:10.4.0
    hostname: bonita
    depends_on:
      bonita-db:
        condition: service_healthy
    environment:
      DB_VENDOR: postgres
      DB_HOST: bonita-db
      DB_PORT: 5432
      DB_NAME: ${BONITA_DB_NAME:-bonita}
      DB_USER: ${BONITA_DB_USER:-bonita}
      DB_PASS: ${BONITA_DB_PASS:-bpm}
      BIZ_DB_NAME: ${BONITA_BIZ_DB_NAME:-business_data}
      BIZ_DB_USER: ${BONITA_BIZ_DB_USER:-business_data}
      BIZ_DB_PASS: ${BONITA_BIZ_DB_PASS:-bpm}
      BONITA_RUNTIME_ADMIN_USERNAME: ${BONITA_USERNAME:-install}
      BONITA_RUNTIME_ADMIN_PASSWORD: ${BONITA_PASSWORD:-install}
      PLATFORM_LOGIN: ${BONITA_PLATFORM_USERNAME:-platformAdmin}
      PLATFORM_PASSWORD: ${BONITA_PLATFORM_PASSWORD:-platform}
      MONITORING_USERNAME: ${BONITA_MONITORING_USERNAME:-monitoring}
      MONITORING_PASSWORD: ${BONITA_MONITORING_PASSWORD:-monitoring_dev}
    ports:
      - "${BONITA_PORT:-8080}:8080"
    volumes:
      - bonita_temp:/opt/bonita/server/temp
      - bonita_work:/opt/bonita/server/work
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
  bonita_db_data:
  bonita_temp:
  bonita_work:
