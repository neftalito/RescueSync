name: rescuesync

services:
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rescuesync}
      POSTGRES_USER: ${POSTGRES_USER:-rescuesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescuesync_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: production
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:-}
      NACIONAL_BASE_URL: ${NACIONAL_BASE_URL:-http://host.docker.internal:8001/api/v1}
      NACIONAL_TIMEOUT_SECONDS: ${NACIONAL_TIMEOUT_SECONDS:-10}
      NACIONAL_ENCRYPTION_KEY: ${NACIONAL_ENCRYPTION_KEY:-}
      NACIONAL_SISTEMA_ORIGEN: ${NACIONAL_SISTEMA_ORIGEN:-}
      NACIONAL_APROVISIONAMIENTO_LOGIN: ${NACIONAL_APROVISIONAMIENTO_LOGIN:-}
      NACIONAL_APROVISIONAMIENTO_PASSWORD: ${NACIONAL_APROVISIONAMIENTO_PASSWORD:-}
      NACIONAL_CATALOGO_LOGIN: ${NACIONAL_CATALOGO_LOGIN:-}
      NACIONAL_CATALOGO_PASSWORD: ${NACIONAL_CATALOGO_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rescuesync}
      POSTGRES_USER: ${POSTGRES_USER:-rescuesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescuesync_dev}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:${FRONTEND_PORT:-5173}"]}'
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rescuesync.org}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-administrador123}
      BONITA_BASE_URL: ${BONITA_BASE_URL:-http://bonita:8080/bonita}
      BONITA_USERNAME: ${BONITA_USERNAME:-install}
      BONITA_PASSWORD: ${BONITA_PASSWORD:-install}
      BONITA_PROCESS_NAME: ${BONITA_PROCESS_NAME:-RescueSync}
      BONITA_PROCESS_VERSION: ${BONITA_PROCESS_VERSION:-1.4}
      BONITA_TIMEZONE: ${BONITA_TIMEZONE:-UTC}
      BONITA_MONITOR_ENABLED: ${BONITA_MONITOR_ENABLED:-true}
      BONITA_MONITOR_INTERVAL_SECONDS: ${BONITA_MONITOR_INTERVAL_SECONDS:-30}
      BONITA_CALLBACK_TOKEN: ${BONITA_CALLBACK_TOKEN:-dev-only-rescuesync-bonita-callback-token}
      BONITA_CLIENT_CONNECT_TIMEOUT_SECONDS: ${BONITA_CLIENT_CONNECT_TIMEOUT_SECONDS:-3}
      BONITA_CLIENT_READ_TIMEOUT_SECONDS: ${BONITA_CLIENT_READ_TIMEOUT_SECONDS:-10}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-no-reply@rescuesync.org}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:${FRONTEND_PORT:-5173}}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: development
    command:
      - fastapi
      - dev
      - app/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *backend-environment
      COVERAGE_FILE: /tmp/.coverage
      RUFF_CACHE_DIR: /tmp/ruff_cache
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./docs:/docs:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    command:
      - sh
      - -c
      - |
        until wget -q -O /dev/null http://backend:8000/api/v1/health/bonita; do sleep 2; done
        exec npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  bonita-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BONITA_DB_NAME:-bonita}
      POSTGRES_USER: ${BONITA_DB_USER:-bonita}
      POSTGRES_PASSWORD: ${BONITA_DB_PASS:-bpm}
      BIZ_DB_NAME: ${BONITA_BIZ_DB_NAME:-business_data}
      BIZ_DB_USER: ${BONITA_BIZ_DB_USER:-business_data}
      BIZ_DB_PASS: ${BONITA_BIZ_DB_PASS:-bpm}
    volumes:
      - bonita_db_data:/var/lib/postgresql/data
      - ./docker/bonita-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bonita:
    image: bonita:10.4.0
    extra_hosts:
      - host.docker.internal:host-gateway
    hostname: bonita
    depends_on:
      bonita-db:
        condition: service_healthy
    environment:
      DB_VENDOR: postgres
      DB_HOST: bonita-db
      DB_PORT: 5432
      DB_NAME: ${BONITA_DB_NAME:-bonita}
      DB_USER: ${BONITA_DB_USER:-bonita}
      DB_PASS: ${BONITA_DB_PASS:-bpm}
      BIZ_DB_NAME: ${BONITA_BIZ_DB_NAME:-business_data}
      BIZ_DB_USER: ${BONITA_BIZ_DB_USER:-business_data}
      BIZ_DB_PASS: ${BONITA_BIZ_DB_PASS:-bpm}
      BONITA_RUNTIME_ADMIN_USERNAME: ${BONITA_USERNAME:-install}
      BONITA_RUNTIME_ADMIN_PASSWORD: ${BONITA_PASSWORD:-install}
      PLATFORM_LOGIN: ${BONITA_PLATFORM_USERNAME:-platformAdmin}
      PLATFORM_PASSWORD: ${BONITA_PLATFORM_PASSWORD:-platform}
      MONITORING_USERNAME: ${BONITA_MONITORING_USERNAME:-monitoring}
      MONITORING_PASSWORD: ${BONITA_MONITORING_PASSWORD:-monitoring_dev}
    ports:
      - "${BONITA_PORT:-8080}:8080"
    volumes:
      - bonita_temp:/opt/bonita/server/temp
      - bonita_work:/opt/bonita/server/work
    restart: unless-stopped

  bonita-deploy:
    build:
      context: ./backend
      target: production
    command: ["python", "-m", "app.integrations.bonita.deploy"]
    environment:
      BONITA_BASE_URL: http://bonita:8080/bonita
      BONITA_USERNAME: ${BONITA_USERNAME:-install}
      BONITA_PASSWORD: ${BONITA_PASSWORD:-install}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rescuesync.org}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-administrador123}
      BONITA_ACTOR_PASSWORD: ${BONITA_ACTOR_PASSWORD:-}
      BONITA_PROCESS_NAME: ${BONITA_PROCESS_NAME:-RescueSync}
      BONITA_PROCESS_VERSION: ${BONITA_PROCESS_VERSION:-1.4}
      BONITA_CALLBACK_TOKEN: ${BONITA_CALLBACK_TOKEN:-dev-only-rescuesync-bonita-callback-token}
      BONITA_BAR_PATH: /bonita-source
      BONITA_STARTUP_TIMEOUT_SECONDS: ${BONITA_STARTUP_TIMEOUT_SECONDS:-300}
      BONITA_REQUEST_TIMEOUT_SECONDS: ${BONITA_REQUEST_TIMEOUT_SECONDS:-30}
      BONITA_BACKEND_BASE_URL: ${BONITA_BACKEND_BASE_URL:-http://backend:8000}
      BONITA_NATIONAL_API_BASE_URL: ${BONITA_NATIONAL_API_BASE_URL:-http://host.docker.internal:8001}
      BONITA_NATIONAL_API_LOGIN: ${BONITA_NATIONAL_API_LOGIN:-}
      BONITA_NATIONAL_API_PASSWORD: ${BONITA_NATIONAL_API_PASSWORD:-}
      BONITA_MAX_REINTENTOS_INTEGRACION: ${BONITA_MAX_REINTENTOS_INTEGRACION:-3}
      BONITA_OFFER_WINDOW_MS: ${BONITA_OFFER_WINDOW_MS:-7200000}
      BONITA_CONNECT_TIMEOUT_MS: ${BONITA_CONNECT_TIMEOUT_MS:-5000}
      BONITA_READ_TIMEOUT_MS: ${BONITA_READ_TIMEOUT_MS:-30000}
    volumes:
      - ./docs:/bonita-source:ro
    depends_on:
      bonita:
        condition: service_started
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  frontend_node_modules:
  bonita_db_data:
  bonita_temp:
  bonita_work:
