apiVersion: apps/v1
kind: Deployment
metadata:
  name: prioridad
spec:
  selector:
    matchLabels:
      app: prioridad
  template:
    metadata:
      labels:
        app: prioridad
    spec:
      containers:
        - name: api
          image: tu-usuario/rescuesync-prioridad:1.0.0
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: prioridad
spec:
  type: NodePort
  selector:
    app: prioridad
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prioridad
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prioridad
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
